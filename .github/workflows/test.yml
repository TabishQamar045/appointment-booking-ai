name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointment_booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Mirrors backend/.env.test.example - CI supplies these as real env
      # vars instead of that file, which is gitignored (see tests/setup.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appointment_booking_test?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      GROQ_API_KEY: unused-fetch-is-mocked-in-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Type-check (src + tests)
        run: npm run typecheck:test

      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointment_booking_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # playwright.config.ts / e2e/global-setup.ts read this to point the
      # backend it boots (and the migrate-reset-and-seed step) at CI's
      # Postgres service instead of a local dev machine's.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appointment_booking_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Boots the real backend + frontend dev servers and resets/reseeds
      # the e2e database itself (see playwright.config.ts's webServer and
      # globalSetup) - nothing else to start manually here.
      - name: Run e2e suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
